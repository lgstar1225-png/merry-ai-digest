name: MERRY AI DIGEST
on:
  workflow_dispatch:
    inputs:
      target_mode:
        description: Source mode
        type: choice
        required: true
        options: [DIRECT_URL, LATEST_AI_YOUTUBE, GITHUB]
        default: DIRECT_URL
      youtube_url:
        description: YouTube URL for DIRECT_URL
        type: string
        required: false
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install -r requirements.txt
      - name: Generate digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_MODE: ${{ inputs.target_mode }}
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python digest_pipeline.py
      - name: Upload output even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merry-ai-digest-${{ github.run_id }}
          path: output_digest/
          if-no-files-found: warn
          retention-days: 7

