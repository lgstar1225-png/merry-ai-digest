name: Retry fix live test
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  live-test:
    if: github.head_ref == 'fix/gemini-network-retry-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          python -m pip install -r requirements.txt
      - name: Generate test digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_MODE: LATEST_AI_YOUTUBE
        run: python digest_pipeline.py
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-test-${{ github.run_id }}
          path: output_digest/
          if-no-files-found: warn
          retention-days: 7
